<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thundr</title>
<style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0b0f19; color:#f8fafc; font-family:Segoe UI,Arial,sans-serif; }
  button { font-size:2rem; font-weight:800; padding:28px 60px; border:none; border-radius:18px; background:#38bdf8; color:#000; cursor:pointer; }
  button:hover { background:#0ea5e9; }
  #info { margin-top:24px; font-size:1.2rem; color:#94a3b8; }
  a { margin-top:30px; color:#475569; font-size:.8rem; }
</style>
</head>
<body>
<button id="btn" onclick="go()">Зайти на аккаунт</button>
<div id="info"></div>
<a href="/full">все аккаунты</a>
<script>
async function go() {
  const info = document.getElementById('info');
  info.textContent = 'Открываю...';
  try {
    const d = await (await fetch('/api/open-next', {method:'POST'})).json();
    info.textContent = d.ok ? `✅ ${d.username} (${d.number}/${d.total})` : `⚠️ ${d.error}`;
  } catch (e) { info.textContent = '⚠️ Нет связи с сервером'; }
}
</script>
</body>
</html>
