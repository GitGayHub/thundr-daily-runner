name: Thundr Daily Rewards Claimer

on:
  schedule:
    # Run every 5 hours as requested by user (00:05, 05:05, 10:05, 15:05, 20:05 UTC)
    - cron: '5 */5 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute: run (claim rewards), goal (progress report), boost (boost store check)'
        type: choice
        options:
          - run
          - goal
          - boost
        default: run
      dry_run:
        description: 'Dry run (simulate without claiming)?'
        type: boolean
        required: false
        default: false
      notify_mode:
        description: 'Telegram notification mode (all, rewards_only, errors_only, summary, digest_2x)'
        type: choice
        options:
          - all
          - rewards_only
          - errors_only
          - summary
          - digest_2x
        default: digest_2x
      force_notify:
        description: 'Force Telegram summary notification even if throttled?'
        type: boolean
        required: false
        default: false

concurrency:
  group: thundr-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  claim-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium (Fallback Re-Auth Engine)
        run: |
          playwright install --with-deps chromium

      - name: Restore Persistent Runtime Data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/accounts.json
            data/telegram_state.json
            data/history.json
            data/history.csv
          key: thundr-data-${{ github.run_id }}
          restore-keys: |
            thundr-data-

      - name: Run Thundr Daily Claimer
        env:
          THUNDR_ACCOUNTS_JSON: ${{ secrets.THUNDR_ACCOUNTS_JSON }}
          THUNDR_USERNAME: ${{ secrets.THUNDR_USERNAME }}
          THUNDR_PASSWORD: ${{ secrets.THUNDR_PASSWORD }}
          THUNDR_USER_ID: ${{ secrets.THUNDR_USER_ID }}
          THUNDR_HASHED_TOKEN: ${{ secrets.THUNDR_HASHED_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MODE: ${{ inputs.notify_mode || secrets.TELEGRAM_MODE || 'digest_2x' }}
          APP_TIMEZONE: Europe/Berlin
          HEADLESS_BROWSER: 'true'
        run: |
          mkdir -p data
          ACTION="${{ inputs.action || 'run' }}"
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          FORCE_FLAG=""
          if [ "${{ inputs.force_notify }}" = "true" ]; then
            FORCE_FLAG="--force-notify"
          fi

          if [ "$ACTION" = "goal" ]; then
            python cli.py goal
          elif [ "$ACTION" = "boost" ]; then
            python cli.py boost --type mini $DRY_RUN_FLAG
          else
            python cli.py run $DRY_RUN_FLAG $FORCE_FLAG
          fi

      - name: Save Persistent Runtime Data
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/accounts.json
            data/telegram_state.json
            data/history.json
            data/history.csv
          key: thundr-data-${{ github.run_id }}

      - name: Upload Claim History & Statistics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: thundr-history
          path: |
            data/history.json
            data/history.csv
          if-no-files-found: ignore
          retention-days: 1

      - name: Send Failure Alert to Telegram
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')
          if token and chat_id:
              text = '❌ <b>Thundr Daily Claimer — Ошибка в GitHub Actions!</b>\n\nЗапуск завершился с ошибкой. Проверьте логи во вкладке Actions.'
              try:
                  requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}, timeout=10)
              except Exception:
                  pass
          "
